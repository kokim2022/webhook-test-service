services:
  webhook-testing:
    build: .
    container_name: webhook-testing
    restart: unless-stopped
    environment:
      - PORT=3999
    ports:
      - "3999:3999"

  # Pangolin tunnel: expose the webhook receiver publicly. In the Pangolin dashboard,
  # point the resource at http://webhook-testing:3999 (same compose network).
  pangolin-site:
    image: fosrl/pangolin-cli
    container_name: pangolin-site
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT:-https://app.pangolin.net}
      - SITE_ID=${SITE_ID}
      - SITE_SECRET=${SITE_SECRET}
    depends_on:
      - webhook-testing
